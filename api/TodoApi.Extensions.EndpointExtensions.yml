      repo: https://github.com/waydxd/sample-cs-api-backend
    id: RegisterAllEndpoints
    path: Extensions/EndpointExtensions.cs
    startLine: 23
  assemblies:
  - TodoApi
  namespace: TodoApi.Extensions
  summary: >-
    Discovers all types implementing <xref href="TodoApi.Extensions.IEndpointModule" data-throw-if-not-resolved="false"></xref> in the assembly,

    instantiates them, and calls <xref href="TodoApi.Extensions.IEndpointModule.RegisterEndpoints(Microsoft.AspNetCore.Routing.IEndpointRouteBuilder)" data-throw-if-not-resolved="false"></xref> on each.

    This keeps Program.cs clean by avoiding explicit endpoint registration.
  example: []
  syntax:
    content: public static IEndpointRouteBuilder RegisterAllEndpoints(this IEndpointRouteBuilder endpoints)
    parameters:
    - id: endpoints
      type: Microsoft.AspNetCore.Routing.IEndpointRouteBuilder
      description: The endpoint route builder.
    return:
      type: Microsoft.AspNetCore.Routing.IEndpointRouteBuilder
      description: The same <code class="paramref">endpoints</code> instance for chaining.
    content.vb: Public Shared Function RegisterAllEndpoints(endpoints As IEndpointRouteBuilder) As IEndpointRouteBuilder
  overload: TodoApi.Extensions.EndpointExtensions.RegisterAllEndpoints*
